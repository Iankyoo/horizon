spring:
  application:
    name: horizon
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

app:
  # Frontend roda sempre no host (nunca containerizado na v1), então o
  # default vale tanto no profile local quanto no docker.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
